name: Apple Jobs Trend Finder — US Tech Demand

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9:00 AM UTC (matches flight-deals schedule)
  workflow_dispatch:

# Grant the GITHUB_TOKEN contents:write so the "Commit history" step can push back.
permissions:
  contents: write

jobs:
  apple-jobs-digest:
    name: Scrape Apple US Jobs & Send Telegram Digest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so the auto-commit step can push back cleanly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-apple-jobs-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Apple Jobs trend finder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Quick smoke test: confirm bot token + chat id actually work
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN length: ${#TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}"
            # Hit getMe to validate the bot token
            BOT_CHECK=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | head -c 200)
            echo "Bot getMe response: $BOT_CHECK"
            # Send a tiny test message to verify chat id
            CHAT_CHECK=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🛠️ Apple Jobs workflow smoke test — if you see this, Telegram delivery works." \
              -d "disable_web_page_preview=true" | head -c 300)
            echo "Smoke-test sendMessage response: $CHAT_CHECK"
          else
            echo "WARNING: Telegram creds missing."
          fi
          echo "---"
          python find_apple_jobs.py

      - name: Commit history.json + latest_snapshot.json
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Pull any changes that may have landed since checkout (cron runs can race)
          git pull --rebase --autostash origin main || true
          git add history.json latest_snapshot.json
          if ! git diff --staged --quiet; then
            git commit -m "Daily Apple US jobs digest - $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
